workflows:
  android-workflow:
    name: Android APK
    environment:
      flutter: stable
    scripts:
      - name: Fix Android project
        script: |
          rm -rf android
          flutter create . --platforms=android
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
